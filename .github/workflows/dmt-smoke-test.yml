name: DMT Smoke Test

on:
  schedule:
    # Lunes y jueves a las 09:00 ART (12:00 UTC)
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  dmt-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DMT smoke test
        env:
          DMT_SMOKE_TEST_URL: https://www.desarr.com/api/det-submit
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: npm run test:dmt-smoke
